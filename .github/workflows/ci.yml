name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dkotlin.incremental=false
    -Dkotlin.compiler.execution.strategy=in-process

# Two independent jobs, so the modern jar (what production servers run) never waits on or fails
# because of BuildTools and the legacy Spigot jars.
jobs:
  modern:
    name: Modern jar (Paper 1.20.6+)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Gradle resolves every module's toolchain while configuring, so both jobs need all three:
      # 8 for unify-core and legacy handlers, 26 for the 26.x handler, 21 for the rest and Gradle itself.
      - name: Set up JDKs 8, 26 and 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            26
            21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.paper/cache
          key: gradle-modern-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-modern-

      - name: Build
        run: >-
          ./gradlew bundledModern --no-daemon --build-cache
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_21_X64,JAVA_HOME_26_X64
          -Porg.gradle.java.installations.auto-download=false

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: unify-modern-${{ github.sha }}
          path: build/libs/Unify-*-modern.jar
          if-no-files-found: error
          retention-days: 14

  legacy:
    name: Legacy jar (1.8-1.16)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same three JDKs as the modern job; see the note there.
      - name: Set up JDKs 8, 26 and 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            26
            21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-legacy-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-legacy-

      # The legacy NMS modules compile against full Spigot server jars, which only exist after running
      # BuildTools. Build them once and cache them; later runs skip this entirely.
      - name: Cache Spigot server jars
        id: spigot-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/spigotmc
          key: spigot-buildtools-1.8.8-1.9.4-1.12.2-1.16.5

      - name: Build Spigot server jars
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p buildtools && cd buildtools
          curl -fsSL -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          for version in 1.8.8 1.9.4 1.12.2 1.16.5; do
            "$JAVA_HOME_8_X64/bin/java" -jar BuildTools.jar --rev "$version"
          done

      - name: Build
        run: >-
          ./gradlew bundledLegacy --no-daemon --build-cache
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_21_X64,JAVA_HOME_26_X64
          -Porg.gradle.java.installations.auto-download=false

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: unify-legacy-${{ github.sha }}
          path: build/libs/Unify-*-legacy.jar
          if-no-files-found: error
          retention-days: 14
