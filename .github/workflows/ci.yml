name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dkotlin.incremental=false
    -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}   # <-- your PAT

      # Cache the Gradle wrapper binary separately — changes very rarely
      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # Cache all Gradle caches: deps, build-cache, and paperweight's
      # minecraft artifact cache (the most expensive download in your logs ~60s)
      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/configuration-cache
            ~/.paper/cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew build --no-daemon --build-cache --configuration-cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ github.sha }}
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-dev*.jar
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: '**/build/reports/tests/'
          retention-days: 7
          if-no-files-found: ignore
