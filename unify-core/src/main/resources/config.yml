scoreboard:
  enabled: true
  title: "&d&lHUB"
  update-interval-ticks: 20
  lines:
    - "&fRank: &d<rank>"
    - "&fFriends Online: &d0"
    - "&fLevel: &d0"
    - "  &fProgress: &d<bar>"
    - ""
    - "&fLobby: &dGarden"
    - "&fPlayers: &d0/1000"
    - ""
    - "&eplay.etheriamc.net"

nametags:
  enabled: true
  update-interval-ticks: 20
  # Optional alias shown above the player's head.
  # When set, the vanilla nametag is hidden and this text is rendered as a floating label.
  # Placeholders: {player} = account name, {display_name} = Bukkit display name.
  display-name-format: ""

tab:
  enabled: true
  update-interval-ticks: 40
  header:
    - ""
    - "<gradient:light_purple:gold><bold>EtheriaMC</bold></gradient>"
    - "&7Welcome, &f{player}"
    - ""
  footer:
    - ""
    - "&7Online: &d{online}&7/&d{max_players}"
    - "&eplay.etheriamc.net"
    - ""
