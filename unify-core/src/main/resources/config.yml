# Module switches take effect after a server restart. Turning a module off removes it for every
# plugin; plugins that declare they need it (@UnifyPlugin(modules = [...])) log an error at startup.
modules:
  visibility: true
  nametags: true
  scoreboard: true
  tab: true
  bossbar: true
  menus: true
  holograms: true
  npcs: true
  requests: true
  world-previews: true

# Every display below also runs whenever another plugin registers a provider for it.
# The "enabled" flags only turn on Unify's own config-driven display, so a fresh install changes nothing.

nametags:
  enabled: false
  update-interval-ticks: 2
  # Extra lines above the normal player name, ordered from top to bottom.
  # Supports & colors, {player}, and {viewer}. An empty list keeps a single-line nametag.
  lines: []

scoreboard:
  # Unify has no built-in sidebar; this only paces boards that plugins provide.
  update-interval-ticks: 20

tab:
  enabled: false
  update-interval-ticks: 40
  # Supports & colors, {player}, {online}, {max_players} and {ping}.
  header:
    - "&fWelcome, {player}"
  footer:
    - "&7Online: &f{online}&7/&f{max_players}"

bossbar:
  enabled: false
  update-interval-ticks: 20
  tick-interval-ticks: 4
  # Indent prefix prepended once per nesting level.
  indent: "  "
  # Format: title|color|style|progress (everything after the title is optional).
  lines: []
